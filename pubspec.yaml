name: rk_classes_app
description: "RK Classes — student, parent and staff mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  table_calendar: ^3.1.2
  url_launcher: ^6.3.2
  signalr_netcore: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/images/rk_logo_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/rk_logo_full.png
    - assets/images/rk_logo_icon.png
